<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book IPL 2026 Tickets</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <p>IPL 2026 Tickets</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#matches">Matches</a>
            <a href="booking.html">Book Ticket</a>
        </nav>
    </header>

    <main>
        <section class="card booking-page">
            <h1>Book Your IPL Tickets</h1>
            <p>Fill in your details to request tickets for a match.</p>

            <form action="#" method="get">
                <p>
                    <label for="name">Full Name:</label><br>
                    <input type="text" id="name" name="name"
                           minlength="2" maxlength="50" required>
                </p>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="phone">Phone Number:</label><br>
                    <input type="tel" id="phone" name="phone"
                           pattern="[0-9]{10}" minlength="10" maxlength="10"
                           placeholder="10 digit number" required>
                </p>

                <p>
                    <label for="match">Select Match:</label><br>
                    <select id="match" name="match" required>
                        <option value="">Choose a match</option>
                        <option value="CSK vs MI">Match 1: CSK vs MI</option>
                        <option value="RCB vs KKR">Match 2: RCB vs KKR</option>
                        <option value="SRH vs RR">Match 3: SRH vs RR</option>
                        <option value="MI vs RCB">Match 4: MI vs RCB</option>
                    </select>
                </p>

                <p>
                    <label for="stand">Stand Category:</label><br>
                    <select id="stand" name="stand" required>
                        <option value="">Choose a stand</option>
                        <option value="General">General</option>
                        <option value="Premium">Premium</option>
                        <option value="VIP">VIP</option>
                    </select>
                </p>

                <p>
                    <label for="tickets">Number of Tickets:</label><br>
                    <input type="number" id="tickets" name="tickets"
                           min="1" max="10" required>
                </p>

                <p>
                    <input type="checkbox" id="updates" name="updates">
                    <label for="updates">Send me match updates by email</label>
                </p>

                <button type="submit">Submit Booking</button>
                <button type="reset">Reset Form</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 IPL Ticket Booking. All rights reserved.</p>
    </footer>
</body>
</html>
